name: Independent Provider recruitment opportunity
# This is not a claimable code bounty.
description: Suggest onboarding an existing commercial machine-callable service for verified demand.
title: "[Provider opportunity] "
labels: ["work:miner", "opportunity:provider", "status:triage", "reward:unfunded"]
body:
  - type: markdown
    attributes:
      value: |
        **Not a claimable bounty.** This is a public-safe Provider recruitment lead for an already-existing service. Do not publish private buyers, budgets, API credentials, contracts, hidden evaluation weaknesses or live request payloads. A maintainer must confirm eligibility and any buyer demand before changing status.
  - type: input
    id: capability
    attributes:
      label: Service type or existing Intent
      description: State the broad task and any already-known public Intent. Do not invent a new Intent for each Provider.
    validations:
      required: true
  - type: textarea
    id: usefulness
    attributes:
      label: Why existing supply may be useful
      description: Publicly verifiable market gap or broad use case only. Do not imply a guaranteed customer, funded order or ranking.
    validations:
      required: true
  - type: textarea
    id: availability
    attributes:
      label: Public integration information
      description: Public endpoint documentation, access terms, data format and conditions, without secrets or bypass instructions.
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: What would count as a usable onboarding?
      description: At a general level, demonstrate approved service connectivity, valid Intent fit, eligibility and a working example; no promised winner or earnings.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Disclosure check
      options:
        - label: This proposal contains only publicly shareable information and does not promise payment, buyer demand or ranking.
          required: true
